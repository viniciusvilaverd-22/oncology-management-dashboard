name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  repository:
    name: Repository quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f SECURITY.md
          test -f .env.example
          test -f backend/requirements.txt
          test -f frontend/package-lock.json
          test -f frontend/.env.demo
          test -f docker-compose.demo.yml

      - name: Reject sensitive file types
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -name '.env' -o -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name '*.pfx' -o -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' \) -not -path './.git/*' | grep -q .; then
            echo "Sensitive file type found in repository."
            exit 1
          fi

      - name: Reject internal environment references
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'Santa Casa|IPERGS|santacasa\.local|10\.0\.0\.4' . --exclude-dir=.git --exclude=package-lock.json --exclude=ci.yml; then
            echo "Internal environment reference found."
            exit 1
          fi

      - name: Reject personal-name references
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'Vin[ií]cius|Vilaverde' . --exclude-dir=.git --exclude=ci.yml --exclude=package-lock.json; then
            echo "Personal-name reference found in public repository content."
            exit 1
          fi

      - name: Reject private adapter implementation references
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'SOUL MV|DBAMV|AGENDAMENTO_ONCOLOGICO|ITREG_AMB|REG_AMB|RECCON_REC|V_AJUSTES_RECEBIMENTO_DET|ITFAT_NOTA_FISCAL|V_FNCP_ITEM_CONVENIO|REMESSA_FATURA|FA_CUSTO_ATENDIMENTO|CD_REG_AMB|CD_RECCON_REC|CD_ATENDIMENTO|CD_PACIENTE|CD_REMESSA|SN_PAGA|ORACLE_|oracledb|instantclient|tnsnames|CONVENIO_DEMO|X-Convenio-Id|faturamentoMv|setoresMv|fatMv' . --exclude-dir=.git --exclude=package-lock.json --exclude=ci.yml; then
            echo "Private operational adapter reference found in public repository content."
            exit 1
          fi

      - name: Reject common secret patterns
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|gh[pousr]_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}' . --exclude-dir=.git; then
            echo "Potential secret detected."
            exit 1
          fi

  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests

      - name: Run tests
        run: pytest -q

  frontend:
    name: Frontend builds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Frontend demo tests
        run: npm run test:demo

      - name: Production build
        run: npm run build

      - name: Synthetic demo build
        run: npm run build -- --mode demo

  demo-container:
    name: Demo container
    runs-on: ubuntu-latest
    needs: [repository, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build synthetic demo image
        run: docker build -f frontend/Dockerfile.demo -t oncology-dashboard-demo:ci frontend
