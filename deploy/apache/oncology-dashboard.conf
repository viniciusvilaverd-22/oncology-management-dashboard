ProxyPreserveHost On

ProxyPass        /oncology-dashboard/api/ http://127.0.0.1:8091/api/
ProxyPassReverse /oncology-dashboard/api/ http://127.0.0.1:8091/api/

ProxyPass        /oncology-dashboard/health http://127.0.0.1:8091/health
ProxyPassReverse /oncology-dashboard/health http://127.0.0.1:8091/health

ProxyPass        /oncology-dashboard/db-health http://127.0.0.1:8091/db-health
ProxyPassReverse /oncology-dashboard/db-health http://127.0.0.1:8091/db-health

<Directory "/var/www/html/oncology-dashboard">
    Options -Indexes
    AllowOverride None
    Require all granted

    RewriteEngine On
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^ /oncology-dashboard/index.html [L]
</Directory>
